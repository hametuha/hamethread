name: Latest WP Support

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 2am UTC

permissions:
  contents: read
  issues: write

jobs:
  is-outdated:
    name: Check if WP version is outdated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check wp version
        uses: tarosky/farmhand-wp-action@v1
        id: wp_version

      - name: Create issue if needed
        if: ${{ 'true' == steps.wp_version.outputs.should_update }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WP_VERSION: ${{ steps.wp_version.outputs.version }}
        run: |
          TITLE="WordPress ${WP_VERSION} をサポートする"
          # Skip if the same issue already exists (weekly schedule).
          if gh issue list --state all --search "\"${TITLE}\" in:title" --json title -q '.[].title' | grep -qxF "${TITLE}"; then
            echo "Issue already exists: ${TITLE}"
            exit 0
          fi
          gh issue create --title "${TITLE}" --label wp-org --assignee fumikito --body "$(cat <<EOF
          ## TODO

          - [ ] プラグインがWordPress ${WP_VERSION} に対応しているかチェックする
          - [ ] README.md の "Tested up to" を更新する
          EOF
          )"
